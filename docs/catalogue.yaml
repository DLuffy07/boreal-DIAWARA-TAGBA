communes:
  _source_file: Fichier source d'où provient la ligne (chemin relatif à data/sources)
  _row_number: Numéro de ligne dans le fichier source (en-tête exclu)
  _loaded_at: Horodatage du chargement en couche brute
  _row_key: Identifiant unique d'une ligne source, fichier#ligne ; clé de traçabilité vers la quarantaine
  client_id: Identifiant client tel que fourni par le CRM
  client_id_maitre: Identifiant du client après déduplication (voir prep.client_mapping)
  contrat_id: Identifiant du contrat
  sinistre_id: Identifiant du sinistre
  paiement_id: Identifiant du paiement
  date_naissance: Date de naissance du client
  region: Région de résidence (code à 2-4 lettres, ex. IDF)
  csp: Catégorie socio-professionnelle
  consent_marketing: Consentement à la prospection commerciale (1/true = oui)
  email_hash: Empreinte pseudonymisée de l'adresse e-mail (pas de l'e-mail en clair)
  produit: AUTO ou HABITATION
  formule: ESSENTIELLE, CONFORT ou PREMIUM
  canal_distribution: Canal de souscription (AGENT, COURTIER, WEB)
  zone_risque: Zone tarifaire de risque, de 1 (faible) à 5 (élevé)
  franchise: Franchise contractuelle en euros
  bonus_malus: Coefficient de réduction-majoration (auto uniquement)
  puissance_cv: Puissance fiscale du véhicule (auto uniquement)
  surface_m2: Surface du logement en m² (habitation uniquement)
  prime_annuelle: Prime annuelle du contrat en euros
  date_effet: Date de début de couverture (incluse)
  date_resiliation: Date de fin de couverture (exclue) ; vide si le contrat court encore
  date_survenance: Date à laquelle le sinistre s'est produit
  date_declaration: Date à laquelle le sinistre a été déclaré à l'assureur
  garantie: Garantie mise en jeu (COLLISION, VOL, DEGAT_EAUX...)
  statut: Statut du sinistre (OUVERT, CLOTURE, SANS_SUITE, REJETE)
  reserve_initiale: Montant provisionné à l'ouverture du dossier, en euros
  date_paiement: Date du paiement
  montant: Montant payé en euros
  date_audit: Date du contrôle antifraude
  fraude_confirmee: Résultat de l'audit (1/true = fraude confirmée)
  segment_id: Segment de risque = produit-zone-formule-canal
  annee: Année civile
  mois: Mois (1-12) ou premier jour du mois selon la table
  annee_mois: Mois au format AAAA-MM
  run_id: Identifiant d'un lancement du pipeline
  horodatage: Date et heure de l'événement
  statut_ligne: Statut technique
  motif: Raison de la mise en quarantaine
  rule_id: Identifiant de la règle de qualité (voir quality/rules.yaml)
  table_source: Table prep concernée par la règle
  libelle: Description de la règle
  dimension: Dimension qualité (complétude, unicité, validité, cohérence inter-tables, cohérence temporelle)
  gravite: bloquante, majeure ou mineure
  traitement: exclure (hors du cœur), corriger (valeur corrigée), signaler (tracé seulement)
  correction: Correction appliquée quand le traitement est « corriger » ou précision sur le traitement
  detecte_le: Horodatage de la détection
  volume: Nombre de lignes concernées
  duree_s: Durée en secondes
  message: Message d'erreur ou commentaire
tables:
  raw.clients:
    description: Copie fidèle de crm/clients.csv (latin-1, séparateur ;). Toutes les valeurs en texte.
  raw.contrats:
    description: Copie fidèle de contrats/contrats.csv. Toutes les valeurs en texte.
  raw.sinistres:
    description: Copie fidèle de sinistres/sinistres.jsonl, une ligne par enregistrement JSON.
  raw.reglements:
    description: Copie fidèle des 64 fichiers mensuels reglements_AAAA_MM.csv, colonnes alignées par nom (montant_eur
      -> montant).
  raw.audits:
    description: Copie fidèle de antifraude/audits.csv (dossiers audités uniquement).
  prep.clients:
    description: Clients typés et normalisés, sans filtrage (autant de lignes qu'en raw).
    colonnes:
      client_id_brut: Identifiant client tel que lu, avant conversion en entier
  prep.contrats:
    description: Contrats typés et normalisés, sans filtrage.
  prep.sinistres:
    description: Sinistres typés et normalisés, sans filtrage.
  prep.reglements:
    description: Règlements typés, sans filtrage ; les doublons de livraison y sont encore présents.
    colonnes:
      mois_fichier: Mois annoncé par le nom du fichier (sert à détecter les livraisons tardives, règle Q21)
  prep.audits:
    description: Audits typés, sans filtrage.
  prep.client_mapping:
    description: Résultat de la déduplication (script quality/dedup_clients.py) — un client source vers son client
      maître.
  quarantine.anomalies:
    description: Une ligne par couple (règle, ligne source en anomalie). Rien n'est supprimé.
  quarantine.lignes_exclues:
    description: Vue — lignes écartées du cœur (traitement « exclure »), tous motifs concaténés.
    colonnes:
      motifs: Liste des règles et motifs ayant conduit à l'exclusion
  quarantine.clients_dedup:
    description: Identifiants clients absorbés par la déduplication, avec leur client maître.
  quarantine.raw_rejets:
    description: Lignes illisibles à l'ingestion (nombre de champs incorrect, JSON invalide).
    colonnes:
      fichier: Fichier source
      ligne: Numéro de ligne
      contenu: Contenu brut de la ligne rejetée
  core.dim_date:
    description: Calendrier, une ligne par jour de 2019 à 2025.
    colonnes:
      date: Jour
  core.dim_client:
    description: Dimension client en SCD2, une ligne par version d'un client maître.
    colonnes:
      client_sk: Clé technique d'une version de client (md5 de l'identifiant et de valid_from)
      date_naissance: Date de naissance (mise à null si âge hors [18;100], règle Q08)
      age: Âge au 30/06/2025
      tranche_age: 18-24, 25-34, 35-49, 50-64, 65+ ou inconnu
      valid_from: Début de validité de la version (incluse)
      valid_to: Fin de validité (exclue), vide pour la version courante
      is_current: Vrai pour la version en vigueur
      hash_attributs: Empreinte de région + CSP + consentement, sert à détecter un changement
  core.v_client_analyse:
    description: Vue — profil client observé au 30/06/2025, une ligne par client maître. Seule vue client à joindre
      dans les marts.
    colonnes:
      client_sk: Clé de la version utilisée
      age: Âge au 30/06/2025
      tranche_age: 18-24, 25-34, 35-49, 50-64, 65+ ou inconnu
  core.dim_contrat:
    description: Contrats valides (hors quarantaine), rattachés à leur client maître.
  core.dim_segment:
    description: Segments de risque produit × zone × formule × canal présents dans le portefeuille.
  core.dim_garantie:
    description: Référentiel des garanties et du produit auquel elles s'appliquent.
  core.fait_exposition:
    description: Grain contrat × année civile. Base de toute fréquence et de toute prime acquise.
    colonnes:
      exposition_annees: Jours couverts dans l'année / 365,25 (effet inclus, résiliation exclue, fin d'observation
        30/06/2025 incluse)
      prime_acquise: prime_annuelle × exposition_annees, en euros
      resilie_dans_annee: Vrai si la date de résiliation tombe dans l'année (indicatif ; compter les résiliations
        depuis dim_contrat)
  core.fait_sinistre:
    description: Grain sinistre. Charge évaluée au 30/06/2025.
    colonnes:
      montant_paye: Somme des règlements valides du sinistre
      nb_paiements: Nombre de règlements valides
      date_premier_paiement: Date du premier règlement
      date_dernier_paiement: Date du dernier règlement (sert de date de clôture approchée)
      reserve_restante: Pour un sinistre OUVERT, max(réserve initiale − payé, 0) ; sinon 0
      charge: montant_paye + reserve_restante
      retenu: Vrai si statut hors SANS_SUITE et REJETE ; seuls les retenus entrent dans fréquence, coût moyen et
        S/P
      audite: Vrai si le dossier a été contrôlé par l'antifraude
  core.fait_reglement:
    description: Grain paiement. Règlements valides, doublons de livraison exclus.
  meta.ingestion_log:
    description: Journal d'ingestion, une ligne par fichier et par lancement.
    colonnes:
      source: Table brute alimentée
      fichier: Fichier traité
      hash: Empreinte SHA-256 du fichier (détecte une relivraison identique)
      lignes_lues: Lignes lues dans le fichier
      lignes_chargees: Lignes insérées en couche brute
      lignes_rejetees: Lignes illisibles envoyées dans quarantine.raw_rejets
      statut: OK, SKIPPED (fichier déjà chargé à l'identique) ou FAILED
  meta.pipeline_runs:
    description: Journal des étapes du pipeline, une ligne par étape et par lancement.
    colonnes:
      etape: Nom de l'étape (ingest, prep, dedup, quality, core, test, marts, docs)
      statut: OK ou FAILED
  meta.qualite_resultats:
    description: Historique du volume de chaque règle de qualité à chaque exécution.
    colonnes:
      run_at: Horodatage de l'exécution des règles
      lignes_table: Nombre de lignes de la table contrôlée
      taux: volume / lignes_table
  meta.test_results:
    description: Résultat de chaque test bloquant à chaque lancement.
    colonnes:
      module: Fichier de test
      test: Nom du test
      statut: PASSED, FAILED ou SKIPPED
  marts.exploitation_sources:
    description: État de chaque source (dernier chargement, volumes, lignes exclues, fraîcheur).
    colonnes:
      source: Source de données
      dernier_chargement: Dernier chargement réussi
      dernier_fichier: Dernier fichier connu
      nb_fichiers: Nombre de fichiers chargés
      lignes_brutes: Lignes en couche brute
      lignes_exclues: Lignes écartées du cœur
      pct_exclues: Part des lignes exclues, en %
      donnee_la_plus_recente: Date métier la plus récente
      jours_avant_extraction: Écart en jours avec l'extraction du 30/06/2025
      nb_echecs_historiques: Nombre de chargements en échec depuis l'origine
  marts.exploitation_qualite:
    description: Résultat de chaque règle de qualité à la dernière exécution.
    colonnes:
      lignes_table: Nombre de lignes de la table contrôlée
      pct_lignes: Part des lignes concernées, en %
      run_at: Horodatage de l'exécution
  marts.exploitation_tests:
    description: Résultat des tests bloquants du dernier lancement.
    colonnes:
      module: Fichier de test
      test: Nom du test
      statut: PASSED, FAILED ou SKIPPED
  marts.exploitation_runs:
    description: Historique des lancements du pipeline.
    colonnes:
      debut: Début du lancement
      duree_totale_s: Durée totale en secondes
      statut: OK ou FAILED
      etapes: Étapes exécutées dans l'ordre
      erreur: Message de l'étape en échec
  marts.exploitation_ingestion:
    description: Journal d'ingestion hors fichiers ignorés car inchangés.
    colonnes:
      source: Table brute alimentée
      fichier: Fichier traité
      statut: OK ou FAILED
      lignes_lues: Lignes lues
      lignes_chargees: Lignes chargées
      lignes_rejetees: Lignes rejetées
  quarantine.clients_a_revoir:
    description: Clients laissés séparés par la déduplication, une ligne par client à examiner.
    colonnes: {}
  marts.mart_segments:
    description: Indicateurs techniques au grain année × segment × tranche d’âge.
    colonnes:
      tranche_age: Tranche d’âge au 30/06/2025 ; inconnu si date absente ou âge invalide.
      exposition_annees: Durée totale observée en années-polices, jours couverts / 365,25.
      primes_acquises: Somme des primes annuelles proratisées à la durée couverte, en euros.
      nb_resiliations: Résiliations à leur date réelle, parmi les contrats valides de la période observée.
      nb_contrats_exposes: Nombre de contrats-années avec exposition positive ; non additif entre années comme nombre
        unique de contrats.
      nb_sinistres_retenus: Nombre de sinistres hors SANS_SUITE et REJETE.
      nb_sans_suite: Nombre de sinistres au statut SANS_SUITE.
      nb_rejetes: Nombre de sinistres au statut REJETE.
      montant_paye_retenu: Somme des paiements des sinistres retenus, en euros.
      reserve_restante_retenue: Somme des réserves restantes conventionnelles des sinistres retenus, en euros.
      charge_retenue: Somme payé + réserve restante des sinistres retenus, en euros.
      montant_paye_tous_statuts: Somme des paiements de tous les statuts, en euros.
      frequence: Sinistres retenus / exposition, en sinistres par année-police ; null si exposition nulle.
      cout_moyen: Charge retenue / nombre de sinistres retenus, en euros ; null sans sinistre.
      prime_moyenne: Primes acquises / exposition, en euros par année-police.
      ratio_sp: Charge retenue / primes acquises ; ratio brut (0,70 = 70 %), null si prime nulle.
      taux_resiliation: Résiliations / exposition, par année-police ; pas une proportion de clients.
      annee_partielle: Vrai pour 2025, limitée à janvier-juin.
  marts.mart_contrats_analyse:
    description: 'Une ligne par contrat valide : exposition et mesures cumulées observées, profil client de juin
      2025.'
    colonnes:
      tranche_age: Tranche d’âge au 30/06/2025 ; inconnu si date absente ou âge invalide.
      exposition_annees: Durée totale observée en années-polices, jours couverts / 365,25.
      primes_acquises: Somme des primes annuelles proratisées à la durée couverte, en euros.
      nb_sinistres_retenus: Nombre de sinistres hors SANS_SUITE et REJETE.
      charge_retenue: Somme payé + réserve restante des sinistres retenus, en euros.
      nb_resiliations: Résiliations à leur date réelle, parmi les contrats valides de la période observée.
  marts.mart_sinistres_analyse:
    description: Une ligne par sinistre valide avec charge et profil du contrat/client ; tous statuts.
    colonnes:
      tranche_age: Tranche d’âge au 30/06/2025 ; inconnu si date absente ou âge invalide.
      retenu: Vrai si le statut est différent de SANS_SUITE et REJETE.
      montant_paye: Paiements cumulés du sinistre connus à la date d’extraction, en euros.
      reserve_restante: Réserve conventionnelle encore ouverte, en euros.
      charge: Montant payé + réserve restante, en euros.
  marts.mart_ic:
    description: 'Une ligne par axe × groupe × indicateur : estimation et intervalle de confiance à 95 %.'
    colonnes:
      axe: Dimension de regroupement ; global signifie tout le portefeuille.
      groupe: Modalité de la dimension de regroupement.
      indicateur: Nom de la mesure estimée.
      estimation: Valeur ponctuelle de l’indicateur, dans son unité brute.
      ic_bas: Borne inférieure de l’intervalle de confiance, même unité que l’estimation.
      ic_haut: Borne supérieure de l’intervalle de confiance, même unité que l’estimation.
      niveau_confiance: Niveau nominal de confiance, 0,95 pour 95 %.
      methode: Méthode statistique ou de décomposition employée.
      nb_clients_blocs: Nombre de clients uniques, unités de rééchantillonnage du bootstrap.
      repetitions: Nombre de réplications du bootstrap ; zéro pour un intervalle analytique.
      graine: Graine du générateur pseudo-aléatoire, pour reproductibilité.
  marts.mart_tests_statistiques:
    description: Deux comparaisons prévues ; p-values brutes et correction de Holm.
    colonnes:
      comparaison: Population et groupes de la comparaison prévue.
      test: Nom du test statistique utilisé.
      statistique: Rapport de taux pour Poisson ; statistique U pour Mann-Whitney.
      p_value: P-value bilatérale brute ; ne mesure ni la taille de l’effet ni sa causalité.
      n_groupe_1: Nombre de sinistres du premier groupe.
      n_groupe_2: Nombre de sinistres du deuxième groupe.
      mesure_1: Fréquence zone 1 pour Poisson ; médiane de charge AGENT pour Mann-Whitney.
      mesure_2: Fréquence zone 5 pour Poisson ; médiane de charge WEB pour Mann-Whitney.
      interpretation: Périmètre, mesure et limites du test.
      p_value_holm: P-value ajustée de Holm sur les deux comparaisons prévues.
  marts.mart_queue_couts:
    description: Synthèse de la queue de charge des sinistres retenus et sensibilité au maximum.
    colonnes:
      nb_sinistres: Nombre de sinistres retenus dans la distribution analysée.
      mediane: Quantile 50 % de la charge par sinistre retenu, en euros.
      p90: Quantile 90 % de la charge par sinistre retenu, en euros.
      p95: Quantile 95 % de la charge par sinistre retenu, en euros.
      p99: Quantile 99 % de la charge par sinistre retenu, en euros.
      maximum: Charge maximale d’un sinistre retenu, en euros.
      nb_top_1pct: Nombre de dossiers composant le premier centile le plus coûteux, arrondi supérieur.
      part_charge_top_1pct: Part de la charge portée par ces dossiers ; ratio brut.
      charge_totale: Charge totale des sinistres retenus, en euros.
      cout_moyen: Charge retenue / nombre de sinistres retenus, en euros ; null sans sinistre.
      cout_moyen_sans_max: Coût moyen après retrait du seul dossier maximum, sensibilité non officielle.
      ratio_sp: Charge retenue / primes acquises ; ratio brut (0,70 = 70 %), null si prime nulle.
      ratio_sp_sans_max: S/P après retrait du dossier maximum de la charge, primes inchangées ; sensibilité.
  marts.mart_decomposition_sp:
    description: Variation annuelle globale du S/P expliquée par trois effets Shapley ; 2025 partielle.
    colonnes:
      annee_precedente: Année civile servant de référence de comparaison.
      sp_precedent: S/P technique de l’année précédente, ratio brut.
      sp_courant: S/P technique de l’année courante, ratio brut.
      variation_sp: S/P courant moins S/P précédent, ratio brut ; multiplier par 100 pour des points de pourcentage.
      effet_frequence: Contribution Shapley de la fréquence à la variation du S/P, ratio brut.
      effet_cout_moyen: Contribution Shapley du coût moyen à la variation du S/P, ratio brut.
      effet_prime_moyenne: Contribution Shapley de la prime moyenne à la variation du S/P, ratio brut.
      effet_volume_sur_ratio: Zéro par identité algébrique ; l’exposition se simplifie dans le ratio.
      exposition_precedente: Exposition de l’année précédente, en années-polices.
      exposition_courante: Exposition de l’année courante, en années-polices.
      charge_precedente: Charge retenue de l’année précédente, en euros.
      charge_courante: Charge retenue de l’année courante, en euros.
      primes_precedentes: Primes acquises de l’année précédente, en euros.
      primes_courantes: Primes acquises de l’année courante, en euros.
      annee_partielle: Vrai pour 2025, limitée à janvier-juin.
      methode: Méthode statistique ou de décomposition employée.
  marts.mart_contributions_segments:
    description: Contribution comptable de chaque segment à la variation annuelle du S/P global.
    colonnes:
      contribution_sp: Charge du segment / primes globales de l’année, ratio brut.
      precedent: Contribution du même segment à l’année précédente, ratio brut.
      variation_contribution_sp: Variation de la contribution comptable du segment au S/P ; ratio brut.
      annee_partielle: Vrai pour 2025, limitée à janvier-juin.
  marts.mart_valeur_client:
    description: 'Une ligne par client maître : primes acquises moins sinistres payés sur la période observée, hors
      frais et réserves.'
    colonnes:
      tranche_age: Tranche d’âge au 30/06/2025 ; inconnu si date absente ou âge invalide.
      primes_acquises: Somme des primes annuelles proratisées à la durée couverte, en euros.
      sinistres_payes: Paiements cumulés sur les sinistres valides du client, tous statuts, euros.
      valeur_observee: Primes acquises cumulées moins sinistres payés cumulés ; euros, sans frais ni réserves.
      nb_sinistres_tous_statuts: Nombre de sinistres valides du client, tous statuts confondus.
      nb_contrats: Nombre de contrats valides du client sur l’ensemble de la période.
      nb_contrats_actifs: Nombre de contrats du client actifs au 30/06/2025, résiliation exclue.
      auto_actif: Au moins un contrat AUTO actif au 30/06/2025.
      habitation_active: Au moins un contrat HABITATION actif au 30/06/2025.
      multi_detenteur_actuel: Au moins un contrat de chaque produit actif au 30/06/2025.
  marts.mart_retention_individuelle:
    description: 'Une ligne par client, produit et ancienneté : présence au même produit à l’anniversaire ; observabilité
      de la cohorte entière.'
    colonnes:
      date_entree: Date de première souscription valide du client au produit.
      cohorte: Année de première souscription valide du client au produit.
      detention_entree: Mono/Multi mesuré à la première souscription au produit ; Tous agrège les groupes.
      anciennete: Nombre entier d’années écoulées depuis la première souscription au produit.
      date_anniversaire: Date d’entrée décalée du nombre d’années d’ancienneté.
      observable: Tous les anniversaires de la cohorte-produit-ancienneté sont au plus tard le 30/06/2025.
      retenu_anniversaire: Au moins un contrat du même produit actif à l’anniversaire ; null si cohorte non entièrement
        observable.
  marts.mart_retention:
    description: Proportion de clients retenus par cohorte, produit, ancienneté et groupe fixé à l’entrée ; IC Wilson
      ajoutés par le script 05.
    colonnes:
      cohorte: Année de première souscription valide du client au produit.
      anciennete: Nombre entier d’années écoulées depuis la première souscription au produit.
      detention_entree: Mono/Multi mesuré à la première souscription au produit ; Tous agrège les groupes.
      observable: Tous les anniversaires de la cohorte-produit-ancienneté sont au plus tard le 30/06/2025.
      nb_clients_cohorte: Nombre de clients distincts de la cohorte, du produit et du groupe fixé à l’entrée.
      nb_retenus: Clients présents au même produit à l’anniversaire ; null si période inobservable.
      taux_retention: Clients retenus / clients de cohorte ; proportion brute, null pour une case non observable.
      ic_bas: Borne inférieure de l’intervalle de confiance, même unité que l’estimation.
      ic_haut: Borne supérieure de l’intervalle de confiance, même unité que l’estimation.
  marts.mart_pareto_valeur:
    description: Classement et concentration des seules valeurs client strictement positives ; pertes exclues et
      analysées séparément.
    colonnes:
      valeur_observee: Primes acquises cumulées moins sinistres payés cumulés ; euros, sans frais ni réserves.
      rang: Rang décroissant de valeur parmi les clients à valeur positive, départagé par identifiant.
      part_clients_positifs: Rang / nombre de clients à valeur strictement positive.
      part_valeur_positive_cumulee: Somme des valeurs positives jusqu’au rang / total des valeurs positives.
  marts.mart_delais:
    description: 'Une ligne par sinistre : délais observés, statut et audit ; dernier paiement des clôturés comme
      approximation explicitement distincte.'
    colonnes:
      tranche_age: Tranche d’âge au 30/06/2025 ; inconnu si date absente ou âge invalide.
      date_premier_paiement: Date minimale des paiements du sinistre ; null sans paiement.
      date_dernier_paiement: Date maximale des paiements enregistrés ; ce n’est pas une date de clôture.
      montant_paye: Paiements cumulés du sinistre connus à la date d’extraction, en euros.
      charge: Montant payé + réserve restante, en euros.
      audite: Dossier ayant un audit valide dans le cœur.
      delai_declaration_jours: Déclaration moins survenance en jours.
      delai_premier_reglement_jours: Premier paiement moins déclaration en jours ; null si absent ou négatif.
      delai_dernier_reglement_clotures_jours: Dernier paiement moins déclaration, uniquement pour les dossiers CLOTURE
        ; approximation distincte du délai réel de clôture.
